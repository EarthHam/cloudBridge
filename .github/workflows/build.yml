name: Build and draft release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  build:
    name: Check and build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-arm64
            runner: macos-15
            command: npm run dist:mac -- --arm64
            executable: release/mac-arm64/cloudBridge.app/Contents/MacOS/cloudBridge
          - platform: mac-x64
            runner: macos-15-intel
            command: npm run dist:mac -- --x64
            executable: release/mac/cloudBridge.app/Contents/MacOS/cloudBridge
          - platform: win-x64
            runner: windows-2022
            command: npm run dist:win
            executable: release/win-unpacked/cloudBridge.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check release tag
        run: node scripts/release.mjs check-tag
      - name: Install locked dependencies
        run: npm run setup:safe
      - name: Run full checks
        run: npm run check
      - name: Build installers
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: ${{ matrix.command }}
      - name: Test packaged application
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          CLOUD_BRIDGE_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: npx --no-install playwright test tests/e2e/application.spec.mjs
      - name: Upload installers
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/cloudBridge-*.dmg
            release/cloudBridge-*.zip
            release/cloudBridge-*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create release draft
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Verify complete release and generate checksums
        run: |
          node scripts/release.mjs check-tag
          node scripts/release.mjs checksums
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != true ]; then
              echo 'Refusing to replace assets of a published release.' >&2
              exit 1
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          cloudBridge desktop installers / 桌面安装包。

          Test builds: macOS packages use ad-hoc signing and are not notarized; Windows installers are unsigned. Verify SHA256SUMS.txt before testing. Hardware and target-platform acceptance are still required.

          测试包：macOS 使用临时签名，尚未完成 Apple 公证；Windows 安装包未签名。测试前请核对 SHA256SUMS.txt，真实硬件及目标系统仍需验收。
          NOTES
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/cloudBridge-*.dmg \
            release/cloudBridge-*.zip release/cloudBridge-*.exe \
            release/SHA256SUMS.txt --clobber
